alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 6h

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

grafana:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 768Mi

  service:
    type: ClusterIP
