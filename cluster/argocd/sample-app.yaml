apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-nginx
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/seung-ukk/k8s-security-lab.git
    targetRevision: main
    path: apps/sample-app

  destination:
    server: https://kubernetes.default.svc
    namespace: sample

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
